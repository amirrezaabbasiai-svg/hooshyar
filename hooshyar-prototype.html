<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3ETA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>TA</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TA — redesigned frontend (v2 UI)
   Complete UI/UX rebuild. Warm editorial-meets-modern design language:
   · Ink #212A39 on warm paper #F6F2EA
   · Distinctive accent: deep teal #0E7C73 (education) + terracotta #C2603F (human accent)
   · Typography: Vazirmatn (Persian) via Google Fonts, with system fallbacks
   · Layout: right-side app shell with a true navigation rail (RTL)
   · Modern component system: soft cards, clear elevation, metric panels, focus rings
   Both the v2 class names (used by the rebuilt view layer) and the legacy class
   names (used by the dense dashboards) are styled here.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ---------- Tokens ---------- */
:root{
  /* surfaces */
  --bg:#F6F2EA;            /* warm paper */
  --bg-elev:#FBF8F2;
  --ink:#212A39;           /* deep slate-ink */
  --ink-2:#46526A;
  --ink-3:#7B8696;         /* muted warm-gray */
  --line:#E5DECF;          /* warm hairlines */
  --line-2:#D6CDB9;
  --surface:#FFFFFF;
  --surface-2:#F2ECE1;

  /* brand accents */
  --acc:#0E7C73;           /* deep teal — education, calm, distinctive */
  --acc-ink:#0B5E57;
  --acc-soft:#E3F0ED;
  --acc-2:#C2603F;         /* terracotta — human/warm accent */
  --acc-2-soft:#F6E7DF;

  /* semantic */
  --good:#2E7D4F;  --good-soft:#E4F3EA;
  --warn:#B7800B;  --warn-soft:#FAF0DC;
  --bad:#C04444;   --bad-soft:#FAE8E7;

  /* feedback */
  --ring:#8FC9C2;
  --shadow-sm:0 1px 2px rgba(33,42,57,.05);
  --shadow:0 1px 2px rgba(33,42,57,.05),0 8px 24px -14px rgba(33,42,57,.20);
  --shadow-lg:0 2px 6px rgba(33,42,57,.06),0 22px 48px -20px rgba(33,42,57,.32);

  /* shape / type */
  --r-sm:8px; --r:14px; --r-lg:20px;
  --font:'Vazirmatn','Tahoma',system-ui,sans-serif;
  --mono:'SF Mono','Consolas',monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}

body.dark{
  --bg:#14191F;
  --bg-elev:#1B222B;
  --ink:#ECEEF4;
  --ink-2:#B7BFCC;
  --ink-3:#8791A0;
  --line:#2A333F;
  --line-2:#3A4453;
  --surface:#1E262F;
  --surface-2:#242E39;
  --acc:#39B4A8;
  --acc-ink:#7BD6CC;
  --acc-soft:#12332F;
  --acc-2:#DE8A6B;
  --acc-2-soft:#3A241B;
  --good:#4CA97B; --good-soft:#133325;
  --warn:#D9A83C; --warn-soft:#352A12;
  --bad:#E07070;  --bad-soft:#3A1616;
  --ring:#2E6E67;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6);
  --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 26px 54px -22px rgba(0,0,0,.7);
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--ink);margin:0;
  line-height:1.8;font-size:15px;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 420px at 110% -10%,rgba(14,124,115,.06),transparent),
    radial-gradient(720px 380px at -10% 0%,rgba(194,96,63,.05),transparent);
}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.4}
code,.kbd{font-family:var(--mono)}
::selection{background:var(--acc-soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ---------- App shell (right rail for RTL) ---------- */
.app-shell{display:flex;min-height:100vh;max-width:1320px;margin:0 auto}
.app-side{
  width:auto;flex:none;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;padding:20px 14px;
  background:var(--surface);border-inline-end:1px solid var(--line);
  z-index:20;transition:background .3s;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;font-weight:800}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc-2));
  color:#fff;display:grid;place-items:center;font-size:21px;
  box-shadow:0 6px 16px -8px rgba(14,124,115,.6);
}
.brand-name{font-size:17px;letter-spacing:-.01em}
.brand-tag{display:block;font-size:11px;color:var(--ink-3);font-weight:500;margin-top:1px}

.nav-section{font-size:11px;color:var(--ink-3);letter-spacing:.04em;padding:14px 10px 6px;font-weight:600}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:right;
  padding:11px 12px;border:none;background:transparent;color:var(--ink-2);
  font:inherit;font-size:14px;font-weight:600;border-radius:11px;cursor:pointer;
  transition:background .15s var(--ease),color .15s;position:relative;
}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn .ic{font-size:17px;width:22px;text-align:center;flex:none}
.nav-btn .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:11px;
  font-weight:800;border-radius:99px;padding:1px 8px;min-width:22px;text-align:center}
.nav-btn.on{background:var(--acc-soft);color:var(--acc-ink)}
.nav-btn.on::before{content:'';position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;
  width:3px;border-radius:3px;background:var(--acc)}
body.dark .nav-btn.on{color:var(--acc-ink)}

.app-side .spacer{flex:1}
.user-chip{
  display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:var(--acc-soft);
  display:grid;place-items:center;font-size:17px;flex:none}
.user-chip .nm{font-size:13px;font-weight:700;line-height:1.2}
.user-chip .rl{font-size:11px;color:var(--ink-3)}
.icon-btn{
  width:36px;height:36px;flex:none;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center;
  transition:.15s var(--ease);
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);transform:translateY(-1px)}

.app-main{flex:1;min-width:0;padding:26px 30px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.page-head .sub{color:var(--ink-3);font-size:13.5px;margin-top:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Responsive shell ---------- */
.mobile-top{display:none}
@media (max-width:900px){
  .app-shell{flex-direction:column}
  .app-side{position:fixed;inset:0 auto 0 0;height:auto;flex-direction:row;align-items:center;
    padding:8px 10px;width:100%;border-inline-end:none;border-bottom:1px solid var(--line);z-index:40}
  .brand{padding:0 6px 0 0;margin-inline-end:6px}
  .brand-name,.brand-tag,.user-chip .nm,.user-chip .rl,.nav-section{display:none}
  .app-side .nav-section,.app-side .spacer,.app-side .user-chip{display:none}
  .app-side .nav{display:flex;gap:4px;overflow-x:auto;flex:1;justify-content:flex-start}
  .app-side .nav .nav-btn{width:auto;padding:9px 12px;white-space:nowrap}
  .app-side .nav .nav-btn .cnt{display:none}
  .app-side .nav .nav-btn.on::before{display:none}
  .app-main{padding:86px 16px 60px}
}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;margin-bottom:16px;box-shadow:var(--shadow-sm);transition:background .3s;
}
.card h2{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h2 .dot{width:8px;height:8px;border-radius:99px;background:var(--acc);flex:none}
.card h3{font-size:15px;font-weight:700;margin:16px 0 8px;color:var(--ink-2)}
.card .card-hint{color:var(--ink-3);font-size:13px;margin:-8px 0 12px}
.card + .card{margin-top:0}
.stack{display:flex;flex-direction:column;gap:14px}
.stack .card{margin-bottom:0}

/* ---------- Metric panels ---------- */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.metric{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px 16px;position:relative;overflow:hidden;transition:.2s var(--ease);
}
.metric::after{content:'';position:absolute;top:0;inset-inline-start:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--acc),var(--acc-2));opacity:.7}
.metric:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.metric .m-label{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.metric .m-value{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.1}
.metric .m-sub{font-size:11.5px;color:var(--ink-3)}
.metric .m-trend{font-size:11.5px;font-weight:700}
.metric.tone-b .m-value{color:var(--acc)}
.metric.tone-g .m-value{color:var(--good)}
.metric.tone-w .m-value{color:var(--warn)}
.metric.tone-r .m-value{color:var(--bad)}
.metric.tone-o .m-value{color:var(--acc-2)}

/* legacy .stat used by dense dashboards — restyled to match */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;text-align:center;position:relative;overflow:hidden}
.stat b{font-size:28px;display:block;color:var(--acc);font-weight:800}
.stat span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:4px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:10px;padding:10px 18px;cursor:pointer;font:inherit;
  font-size:14px;font-weight:700;background:var(--acc);color:#fff;
  box-shadow:0 4px 12px -6px rgba(14,124,115,.55);transition:.18s var(--ease);
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 6px 16px -6px rgba(14,124,115,.6)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{background:var(--line-2);color:var(--ink-3);cursor:not-allowed;box-shadow:none;transform:none;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:none;font-weight:600}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.btn.dng{background:var(--bad)}
.btn.dng:hover{box-shadow:0 6px 16px -6px rgba(192,68,68,.6)}
.btn.wr{background:var(--acc-2)}
.btn.wr:hover{box-shadow:0 6px 16px -6px rgba(194,96,63,.6)}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 26px;font-size:15px;border-radius:12px}

/* ---------- Chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:99px;padding:6px 14px;margin:3px;
  cursor:pointer;font-size:13px;font-weight:600;user-select:none;transition:.15s var(--ease);color:var(--ink-2)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink)}
.badge{font-size:11px;border-radius:99px;padding:3px 11px;white-space:nowrap;font-weight:700;letter-spacing:.02em}
.badge.ai{background:var(--warn-soft);color:var(--warn);border:1px solid #E7C86E}
.badge.dl{background:var(--acc-soft);color:var(--acc-ink);border:1px solid #BFDCD7}
.badge.srv{background:var(--acc-soft);color:var(--acc-ink);border:1px solid #BFDCD7}
.badge.bk{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.badge.off{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.kw{font-size:12px;border-radius:7px;padding:3px 9px;margin:2px;display:inline-block;border:1px solid transparent;font-weight:600}
.kw.y{background:var(--good-soft);color:var(--good);border-color:#BDE0CC}
.kw.n{background:var(--bad-soft);color:var(--bad);border-color:#EFC1C1}

/* ---------- Forms ---------- */
select,input,textarea{
  font:inherit;font-size:14.5px;padding:9px 13px;border:1.5px solid var(--line-2);
  border-radius:10px;background:var(--surface);color:var(--ink);outline:none;transition:.15s var(--ease);
}
[dir=rtl] select,[dir=rtl] input,[dir=rtl] textarea{text-align:right}
select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:.8}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:16px;height:16px;vertical-align:-2px}
.tarea{width:100%;min-height:110px;border-radius:12px;resize:vertical;line-height:1.8}
.tarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
table.tbl th{background:var(--surface-2);color:var(--ink-2);font-weight:700;text-align:right;
  padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
table.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr{transition:background .1s}
table.tbl tbody tr:hover td{background:var(--acc-soft)}

/* heatmap */
.ht{border-collapse:collapse;width:100%;font-size:11px}
.ht td,.ht th{border:1px solid var(--line);text-align:center;padding:5px 3px;min-width:40px}
.ht th{font-size:9.5px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px;background:var(--surface-2);color:var(--ink-2);font-weight:600}
.ht td.hc{cursor:pointer;font-weight:700;transition:.1s;border-radius:3px}
.ht td.hc:hover{outline:2px solid var(--acc);outline-offset:-2px}
.ht .rn{text-align:right;font-weight:700;background:var(--surface-2);padding:5px 10px}

/* ---------- Progress bars ---------- */
.bar-wrap{background:var(--surface-2);border-radius:99px;height:11px;overflow:hidden;flex:1;border:1px solid var(--line)}
.bar{height:100%;border-radius:99px;transition:width .45s var(--ease);background:linear-gradient(90deg,var(--acc),var(--acc-2))}
.lrow{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:13.5px}
[dir=rtl] .lrow{text-align:right}
.lrow .nm{width:250px;flex:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:9px;border-radius:99px;background:var(--surface-2);width:110px;overflow:hidden;display:inline-block;border:1px solid var(--line)}
.pbar i{display:block;height:100%}

/* ---------- Question options & exam player ---------- */
.qopt{display:block;width:100%;text-align:right;background:var(--surface);border:1.5px solid var(--line-2);
  border-radius:12px;padding:13px 16px;margin:9px 0;cursor:pointer;font:inherit;font-size:14.5px;
  transition:.15s var(--ease);line-height:1.65;color:var(--ink)}
.qopt b{color:var(--acc-2);margin-inline-end:7px;font-weight:800}
.qopt:hover{border-color:var(--acc);transform:translateX(-3px);box-shadow:var(--shadow-sm);background:var(--acc-soft);cursor:pointer}
.qopt.sel{background:var(--acc-soft);border-color:var(--acc);font-weight:700;box-shadow:0 0 0 3px var(--ring)}
.qopt.good{background:var(--good-soft);border-color:var(--good)}
.qopt.bad{background:var(--bad-soft);border-color:var(--bad)}
.qopt.miss{background:var(--surface-2)}
.timer{font-weight:800;font-size:15px;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:99px;padding:6px 16px;letter-spacing:1px;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:#ED8F8F;animation:pulseT 1.1s ease-in-out infinite}
@keyframes pulseT{50%{box-shadow:0 0 0 6px rgba(192,68,68,.12)}}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px;margin-top:14px}
.pal button{border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:10px;
  padding:9px 0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;transition:.13s}
.pal button:hover{border-color:var(--acc);color:var(--acc)}
.pal button.done{background:var(--good);color:#fff;border-color:var(--good)}
.pal button.cur{outline:2px solid var(--acc);outline-offset:2px}

.exam-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--r) var(--r)}
.exam-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-sm);overflow:hidden}
.exam-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.exam-body{padding:22px}
.exam-body .q-meta{color:var(--ink-3);font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.exam-body .q-text{font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.7}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:30px 16px;gap:0}
.login-split{width:100%;max-width:960px;display:grid;grid-template-columns:1fr 1.1fr;gap:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);overflow:hidden}
.login-hero{background:linear-gradient(150deg,#0B5E57,#0E7C73 55%,#C2603F);color:#fff;
  padding:44px 38px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login-hero .mark{font-size:46px}
.login-hero h1{font-size:28px;font-weight:800;line-height:1.35}
.login-hero p{font-size:14.5px;opacity:.92;line-height:1.85}
.login-hero .fact{display:flex;align-items:center;gap:9px;font-size:13px;opacity:.9}
.login-panel{padding:40px 36px}
.login-form{max-width:440px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.role-tab{border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:16px 10px;
  cursor:pointer;font:inherit;text-align:center;transition:.15s var(--ease);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px}
.role-tab .ri{display:none}
.role-tab .rt{display:block;width:100%;font-size:16px;font-weight:800;text-align:center;line-height:1.5;letter-spacing:0}
.role-tab .rs{display:block;width:100%;font-size:11.5px;color:var(--ink-3);text-align:center;font-weight:400}
.role-tab:hover{border-color:var(--acc);transform:translateY(-1px)}
.role-tab.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink);box-shadow:0 0 0 3px var(--ring)}
.login-quick{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.login-quick .qopt{margin:0}
@media (max-width:760px){.login-split{grid-template-columns:1fr}.login-hero{display:none}}

/* ---------- Weekly plan ---------- */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:13px;box-shadow:var(--shadow-sm)}
.daycard h3{margin:0 0 6px;font-size:15px;color:var(--acc);font-weight:800;display:flex;align-items:center;gap:8px}
.daycard h3 .dnum{width:26px;height:26px;border-radius:9px;background:var(--acc-soft);color:var(--acc-ink);
  font-size:12px;display:grid;place-items:center;font-weight:800}
.task{background:var(--surface-2);border-radius:10px;padding:9px 14px;margin:6px 0;font-size:13.5px;
  border-inline-start:3px solid var(--acc-2);line-height:1.6;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.task .t-meta{color:var(--ink-3);font-size:12px;white-space:nowrap}
.stars{color:var(--warn);font-size:13px;letter-spacing:1px}

/* ---------- Notices ---------- */
.notice{background:var(--surface-2);border:1px solid var(--line);border-inline-start:4px solid var(--acc);
  border-radius:12px;padding:13px 17px;font-size:13.5px;margin-bottom:16px;line-height:1.75}
.notice.ok{background:var(--good-soft);border-inline-start-color:var(--good);border-color:#BDE0CC}
.notice.warn{background:var(--warn-soft);border-inline-start-color:var(--warn)}
.notice.danger{background:var(--bad-soft);border-inline-start-color:var(--bad)}

/* ---------- Exam list rows ---------- */
.exam-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px 4px;border-bottom:1px dashed var(--line)}
.exam-row:last-child{border-bottom:none}
.exam-row .e-main{display:flex;align-items:center;gap:11px;flex:1;min-width:200px;flex-wrap:wrap}
.exam-row .e-title{font-weight:700;font-size:14.5px}
.exam-row .e-meta{color:var(--ink-3);font-size:12.5px}
.exam-row .e-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.scanrow{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13.5px;flex-wrap:wrap}
.scanrow .op{border:1.5px solid var(--line-2);border-radius:10px;padding:4px 13px;cursor:pointer;
  background:var(--surface);color:var(--ink);font:inherit;transition:.14s;font-weight:500}
.scanrow .op:hover{border-color:var(--acc);color:var(--acc)}
.scanrow .op.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* ---------- Empty & misc ---------- */
.empty{text-align:center;padding:36px 20px;color:var(--ink-3)}
.empty .ei{font-size:40px;display:block;margin-bottom:10px}
.empty .et{font-weight:700;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.empty .es{font-size:13px}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.kbd{background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 8px;font-size:12px}
.spidermini{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 10px;cursor:pointer;transition:.15s}
.spidermini.on{background:var(--acc-soft);border-color:var(--acc)}

/* ---------- Modal ---------- */
#cfm{backdrop-filter:blur(5px);background:rgba(20,25,31,.55)!important}
#cfm>div{animation:cfmPop .22s var(--ease) both;border-radius:var(--r-lg)!important;
  border:1px solid var(--line);box-shadow:var(--shadow-lg)!important}
@keyframes cfmPop{from{transform:scale(.9) translateY(8px);opacity:0}}

/* ---------- Charts ---------- */
.chart{max-width:100%;height:auto}
.chart.line,.chart.spider{background:var(--surface);border-radius:12px}

/* ---------- Reduced motion & print ---------- */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  body::before{display:none!important}
  .app-side,.app-main .page-head,.mobile-top{display:none!important}
  #printarea{display:block!important}
}
#printarea{display:none;direction:rtl;font-family:'Tahoma',sans-serif;padding:16mm 18mm;color:#1f2a37;line-height:1.8}
#printarea .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:2.5px solid #0E5E57;padding-bottom:8px;margin-bottom:12px;font-size:14px;flex-wrap:wrap}
#printarea .ph b{font-size:18px;color:#0E5E57;font-weight:800}
#printarea .pmeta{font-size:14px;margin-bottom:14px;color:#46526A}
#printarea .pq{break-inside:avoid;margin-bottom:12px;font-size:15px;line-height:1.8}
#printarea .popts{display:flex;flex-wrap:wrap;gap:4px 28px;margin:2px 20px 0 0;font-size:14px}
#printarea .wline{border-bottom:1px dotted #7B8696;height:28px;margin:8px 0}
#printarea .pbreak{page-break-before:always}
#printarea .bgrid{columns:3;font-size:14px}
#printarea .brow{margin-bottom:9px;break-inside:avoid}
#printarea .tkey b{color:#C04444}
#printarea .kline{font-size:13px;line-height:2}
#printarea .pday{margin-bottom:12px;break-inside:avoid}
#printarea .pdh{font-weight:800;color:#0E5E57;border-bottom:1.5px solid #CDE4E0;padding-bottom:4px;margin-bottom:6px;font-size:14.5px}
#printarea .ptask{display:flex;justify-content:space-between;gap:14px;padding:4px 2px;font-size:13.5px;border-bottom:1px dotted #D6CDB9}
#printarea .pmeta2{color:#7B8696;font-size:12.5px;white-space:nowrap}
#printarea .pstar{color:#B7800B}
#printarea .plegend{font-size:13px;color:#46526A;background:#F2ECE1;border:1px solid #D6CDB9;border-radius:8px;padding:8px 12px;margin-top:12px}
#printarea .psign{margin-top:16mm;font-size:13.5px;color:#46526A;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}

'use strict';
/* ---------- Utilities ---------- */
const FA='۰۱۲۳۴۵۶۷۸۹';
function fa(s){s=String(s);
  s=s.replace(/(\d)\.(\d)/g,'$1٫$2');
  return s.replace(/\d/g,d=>FA[+d]);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* make a 4-option question, guaranteeing unique options; returns {o:[...],a:index}
   If authored distractors collide, synthesizes numeric fallbacks (correct±d). */
function mkOpt(correct,wrongs){
  const seen=new Set([String(correct)]);const ws=[];
  const push=w=>{const k=String(w);if(!seen.has(k)&&noEx(w)){seen.add(k);ws.push(w);}};
  wrongs.forEach(push);
  if(ws.length<3&&typeof correct==='number'&&isFinite(correct)){
    for(let d=1;ws.length<3&&d<50;d++){
      const up=Math.round((correct+d)*100)/100;
      const dn=Math.round((correct-d)*100)/100;
      push(up);if(dn>0)push(dn);
    }
  }
  if(ws.length<3)throw new Error('not enough unique distractors');
  const arr=shuffle([correct,...ws.slice(0,3)]);
  return {o:arr,a:arr.indexOf(correct)};
}
function noEx(s){return s!==undefined&&s!==null&&String(s).trim()!=='';}

 {id:'t14',s:'fizik',l:'harkat',d:2,name:'سقوط آزاد x=½gt² (دوازدهم)',gen(){

 /* — قالب‌های دورهٔ اول متوسطه: معلم‌های هفتم/هشتم/نهم هم تولید نامحدود دارند — */

/* publish: teacher deploys with a JOIN WINDOW (مهلت شرکت) — after deadline the

function recordManualResult(eid,pid,pct,pub){
  pub=pub||state.published.find(p=>p.id===eid);if(!pub)return;
  pct=Math.max(-33,Math.min(100,Math.round(pct*10)/10));
  if(!state.pubResults[eid])state.pubResults[eid]={};
  state.pubResults[eid][pid]={pct,t:Date.now(),manual:true};

  P.history.push({t:Date.now(),pct,n:pub.qs.filter(q=>q.type!=='tashrihi').length,manual:true});
  const lids=[...new Set(pub.qs.map(q=>q.l))];
  const bounded=Math.max(0,Math.min(100,pct));
  lids.forEach(lid=>{
    if(!P.lessonStats[lid])P.lessonStats[lid]={tries:[]};
    P.lessonStats[lid].tries.push({t:Date.now(),p:bounded});
  });
  save();
}
function seedStudent(pid,i){
  const r=mulberry32(i*97+1405);const overall=42+r()*50;
  const now=Date.now(),D=864e5;const prof0={history:[],lessonStats:{},role:'student',name:NAMES[i],avatar:i%2?'👩‍🎓':'👨‍🎓',base:Math.round(overall),cls:classFor(i)};
  [14,7,1].forEach(doff=>{
    let tot=0,nn=0;
    lessonsForClass(prof0.cls).forEach(lid=>{
      if(r()<0.75){
        const p=Math.max(8,Math.min(95,Math.round(overall+(r()*24-12)+(r()*16-8))));
        if(!prof0.lessonStats[lid])prof0.lessonStats[lid]={tries:[]};
        prof0.lessonStats[lid].tries.push({t:now-doff*D,p});tot+=p;nn++;}
    });
    prof0.history.push({t:now-doff*D,pct:Math.round(tot/Math.max(1,nn)*10)/10,n:15});
  });
  state.profiles[pid]=prof0;save();return prof0;
}

/* ---------- Sandbox-proof modal confirm ----------

let exam=null;         // current exam-in-progress {qs,t0,dur,timer}
let answers=[];        // chosen option index or null
let idx=0;             // current question

/* Grade-scoped curriculum: a همفتم student studies علوم/ریاضی هفتم — not زیست دوازدهم!
   Seeding/preview stats must only cover that grade's lessons. Empty map entry =

const GRADE_SUBS={'هفتم':['olum7','riazi7','mot7'],'هشتم':['olum8','riazi8','mot8'],'نهم':['olum9','riazi9','mot9']};
const MIDDLE_SUBS=['olum7','olum8','olum9','riazi7','riazi8','riazi9','mot7','mot8','mot9'];

  const only=GRADE_SUBS[cls];   // هفتم/هشتم/نهم → علوم + ریاضی + مطالعات …
  const out=[];

  return out;                   // … everyone else → the 9 high-school subjects only
}

/* ---------- Exam assembly ---------- */
function shuffleOpt(q){const perm=shuffle([0,1,2,3]);
  return {...q,o:perm.map(i=>q.o[i]),a:perm.indexOf(q.a)};}
/* ---------- ضد تقلب: per-student shuffle (anti-cheat) ----------
   Every student receives their own question order AND option order, derived
   deterministicly from (examId|studentId) — so a refresh re-opens the SAME
   personalised sheet, neighbours can't copy, and grading stays exact because
   q.a travels with its options. Teacher print + paper/OMR keep the canonical
   sheet. جامع exams keep the دفترچه subject blocks (shuffle happens INSIDE
   each درس, like real Konkur booklet codes). Server exams stay canonical for
   now (answers are aligned server-side) — roadmap item. */
function hashStr(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffleForStudent(qs,eid,pid,kind){
  const rng=mulberry32(hashStr(eid+'|'+pid));
  const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
  const withOpts=arr=>arr.map(q=>{
    if(q.type==='tashrihi'||!q.o)return q;
    const perm=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(rng()*(i+1));const t=perm[i];perm[i]=perm[j];perm[j]=t;}
    return {...q,o:perm.map(i=>q.o[i]),a:perm.indexOf(q.a)};});
  const mcq=qs.filter(q=>q.type!=='tashrihi'),tash=qs.filter(q=>q.type==='tashrihi');
  if(kind==='jame'){
    const order=[],groups={};
    mcq.forEach(q=>{const s=q.s||LSUB[q.l]||'?';if(!groups[s]){groups[s]=[];order.push(s);}groups[s].push(q);});
    return order.flatMap(s=>withOpts(sh(groups[s]))).concat(sh(tash));
  }
  return withOpts(sh(mcq)).concat(sh(tash));
}
function assembleExam(lessonIds,count,level,kind){
  kind=kind||'mix';
  const ids=new Set(lessonIds);
  /* حالت «کاملاً تشریحی»: no تستی at all (سبک امتحان نهایی) — some teachers want
     essay-only exams, e.g. before امتحانات نهایی. */
  if(kind==='tashrihi')return assembleTashrihiExam(lessonIds,count,level);
  const tPool=shuffle(BANK.filter(q=>ids.has(q.l)&&q.type==='tashrihi'));
  let pool=BANK.filter(q=>ids.has(q.l)&&q.type!=='tashrihi');
  if(level==='easy')pool=pool.filter(q=>q.d<=2);
  else if(level==='mid')pool=pool.filter(q=>q.d===3);
  else if(level==='hard')pool=pool.filter(q=>q.d>=4);
  if(!pool.length)pool=BANK.filter(q=>ids.has(q.l)&&q.type!=='tashrihi');
  pool=shuffle(pool);
  const tpl=TEMPLATES.filter(t=>ids.has(t.l));
  const wantAI=Math.max(1,Math.round(count*0.4));
  const staticN=Math.min(pool.length,count-wantAI>0?count-wantAI:count);
  const qs=pool.slice(0,staticN).map(q=>({...shuffleOpt(q),src:'bank',approved:true}));
  let i=0;
  while(qs.length<count&&tpl.length){
    const t=tpl[i++%tpl.length];
    const g=t.gen();
    qs.push({...g,id:t.id+'#'+i,s:t.s,l:t.l,d:t.d,tpl:t.name,src:'ai',approved:false});
  }
  /* top-up with remaining bank questions when a subject has FEW/NO templates
     (e.g. علوم دورهٔ اول متوسطه) so the requested count is always honoured */
  const used=new Set(qs.filter(q=>q.src!=='ai').map(q=>q.id));
  for(const x of pool){
    if(qs.length>=count)break;
    if(!used.has(x.id)){qs.push({...shuffleOpt(x),src:'bank',approved:true});used.add(x.id);}
  }
  const mcq=shuffle(qs).slice(0,count);
  // descriptive items ride along in حالت ترکیبی (نهایی-style); حالت «فقط تستی» skips them
  const tN=kind==='mcq'?0:count>=15?2:count>=5?1:0;
  const tash=tPool.slice(0,tN).map(q=>({...q,src:'bank',approved:true}));
  return [...mcq,...tash];
}
/* آزمون کاملاً تشریحی (صفر سؤال تستی): verified bank tashrihi first; if the
   bank runs dry for the selected lessons, the SimulatedLLM writes process-focused
   drafts (توضیح/مثال/مراحل) that WAIT in the teacher approval queue (Gate-A). */
function assembleTashrihiExam(lessonIds,count,level){
  const ids=new Set(lessonIds);
  let pool=BANK.filter(q=>ids.has(q.l)&&q.type==='tashrihi');
  if(level==='easy')pool=pool.filter(q=>q.d<=2);
  else if(level==='mid')pool=pool.filter(q=>q.d===3);
  else if(level==='hard')pool=pool.filter(q=>q.d>=4);
  if(!pool.length)pool=BANK.filter(q=>ids.has(q.l)&&q.type==='tashrihi');
  pool=shuffle(pool);
  const qs=pool.slice(0,count).map(q=>({...q,src:'bank',approved:true}));
  const les=(lessonIds||[]).filter(l=>LNAME[l]);
  const dMap={easy:2,mid:3,hard:4};
  let i=0;
  while(qs.length<count&&les.length){qs.push(mkAiTashrihi(les[i%les.length],i,dMap[level]||3));i++;}
  return qs.slice(0,count);
}
/* ---------- آزمون جامع کنکوری (boss one-click, end-of-year school mock) ----------
   One exam across the main subjects (زیست/شیمی/فیزیک/ریاضی), booklet-style:
   questions grouped by subject like the real Konkur. All تستی (سراسری-style),
   auto-approved at launch: مدیر = school-level approver and template questions
   are deterministic + math-verified by unit tests. */
function assembleJameExam(quota,level){
  const qs=[];
  Object.entries(quota).forEach(([sid,cnt])=>{
    cnt=+cnt||0;if(cnt<=0)return;
    const sub=SUBJECTS.find(s=>s.id===sid);if(!sub)return;
    const part=assembleExam(sub.lessons.map(l=>l.id),cnt,level||'mid','mcq').filter(q=>q.type!=='tashrihi');
    part.forEach(q=>{q.approved=true;});
    qs.push(...part);
  });
  return qs;
}
/* per-subject کارتنامه: correct/wrong/blank + official Konkur negative formula */
function jameBreakdown(qs,answers){
  const by={};
  qs.forEach((q,i)=>{

    const s=q.s||LSUB[q.l]||'?';

  });
  Object.values(by).forEach(b=>{b.pct=Math.round(((b.c*3-b.w)*100/(b.n*3))*10)/10;});
  return by;
}
/* تراز تخمینی — DEMO mapping for in-school comparison only (not official):

function estTraz(pct){

/* ---------- Teacher custom questions (سؤال دستی معلم) ----------
   Authored by the teacher, so they skip the 🤖 approval queue (teacher IS
   the approver). Pure builders => unit-tested; UI only collects the form. */
function mkCustomMcq(o){
  if(!o||!o.lesson||!LNAME[o.lesson])throw new Error('مبحث نامعتبر است');
  if(!noEx(o.text))throw new Error('متن سؤال نمی‌تواند خالی باشد');
  const opts=(o.opts||[]).map(x=>String(x==null?'':x).trim());

  if(new Set(opts).size!==4)throw new Error('گزینه‌ها باید متمایز باشند (گزینهٔ تکراری مجاز نیست)');

  return {id:'cq'+Math.random().toString(36).slice(2,9),s:LSUB[o.lesson],l:o.lesson,
    d:Math.max(1,Math.min(5,+o.d||2)),q:String(o.text).trim(),o:opts,a,
    src:'custom',approved:true};

/* parse "آئورت:۳۰، مویرگ، دهلیز:۲۵" → [['آئورت',30],['مویرگ',null],['دهلیز',25]] */
function parseKws(str){
  return String(str||'').split(/[,،;؛\n]+/).map(s=>s.trim()).filter(Boolean).map(part=>{
    const m=part.match(/^(.+?)\s*[:：=]\s*(\d+)\s*$/);
    return m?[m[1].trim(),+m[2]]:[part,null];
  }).filter(p=>p[0]);
}
/* If every word has an explicit weight, keep/normalize to 100.
   Otherwise equal-split (last takes remainder) — same contract as before. */
function resolveKwWeights(pairs){
  const clean=(pairs||[]).map(p=>[String(p[0]||'').trim(),p[1]]).filter(p=>p[0]).slice(0,6);
  if(!clean.length)return [];
  const allW=clean.every(p=>p[1]>0);
  if(!allW){
    const base=Math.floor(100/clean.length);
    return clean.map((p,i)=>[p[0],i===clean.length-1?100-base*(clean.length-1):base]);
  }
  const sum=clean.reduce((s,p)=>s+p[1],0);
  if(sum===100)return clean.map(p=>[p[0],p[1]]);
  let acc=0;
  return clean.map((p,i)=>{
    if(i===clean.length-1)return [p[0],Math.max(0,100-acc)];
    const w=Math.max(1,Math.round(p[1]*100/sum));acc+=w;return [p[0],w];
  });
}
function mkCustomTashrihi(o){
  if(!o||!o.lesson||!LNAME[o.lesson])throw new Error('مبحث نامعتبر است');
  if(!noEx(o.text))throw new Error('متن سؤال نمی‌تواند خالی باشد');
  let kw;
  if(Array.isArray(o.kwPairs)&&o.kwPairs.length){
    kw=resolveKwWeights(o.kwPairs);
    if(!kw.length)throw new Error('حداقل یک کلیدواژهٔ کلیدی برای تصحیح خودکار لازم است');
  }else{
    let kws=(o.kws||[]).map(k=>String(k||'').trim()).filter(Boolean);
    if(!kws.length)throw new Error('حداقل یک کلیدواژهٔ کلیدی برای تصحیح خودکار لازم است');
    if(kws.length>6)kws=kws.slice(0,6);
    const base=Math.floor(100/kws.length);                 // equal weights, last one takes remainder -> sums to exactly 100
    kw=kws.map((k,i)=>[k,i===kws.length-1?100-base*(kws.length-1):base]);
  }
  return {id:'cq'+Math.random().toString(36).slice(2,9),type:'tashrihi',s:LSUB[o.lesson],l:o.lesson,
    d:Math.max(1,Math.min(5,+o.d||2)),q:String(o.text).trim(),
    model:String(o.model||'—').trim()||'—',kw,src:'custom',approved:true};
}

/* merge teacher drafts into a freshly-generated exam, keeping the shape

function mergeDrafts(gen){

/* bulk paste-import (📥 واردکردن گروهی) — one MCQ per line:
   text * option1 * option2 * option3 * option4 * correct(1-4, fa/en digits)
   THE real-school channel for typed question banks downloaded from the
   internet or drafted in Word: teacher pastes; Gate-A stays because the
   teacher IS the approver (questions land in the draft basket as custom). */
function parseBulk(text,lesson){
  const items=[],errs=[];
  if(!LNAME[lesson])return {items,errs:['مبحث نامعتبر است']};
  String(text||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach((ln,i)=>{
    const p=ln.split('*').map(x=>x.trim());
    if(p.length!==6){errs.push('خط '+fa(i+1)+': باید ۶ بخش با * داشته باشد');return;}
    const aj='۱۲۳۴'.indexOf(p[5])>=0?'۱۲۳۴'.indexOf(p[5]):'1234'.indexOf(p[5]);
    if(aj<0||aj>3){errs.push('خط '+fa(i+1)+': شمارهٔ گزینهٔ صحیح (بخش آخر) باید ۱ تا ۴ باشد');return;}
    try{items.push(mkCustomMcq({lesson,text:p[0],opts:[p[1],p[2],p[3],p[4]],correct:aj,d:3}));}
    catch(e){errs.push('خط '+fa(i+1)+': '+e.message);}
  });
  return {items,errs};
}
/* ---------- Grading (official Konkur formula, blueprint §5.2) ---------- */
function gradeExam(qs,ans){
  let c=0,w=0,b=0;const perL={};const tashrihi=[];
  qs.forEach((q,i)=>{const r=ans[i];const L=q.l;
    if(q.type==='tashrihi'){tashrihi.push({i,q,grade:gradeTashrihi(q,r||'')});return;}
    perL[L]=perL[L]||{c:0,w:0,b:0,t:0};perL[L].t++;
    if(r==null){b++;perL[L].b++;}
    else if(r===q.a){c++;perL[L].c++;}
    else{w++;perL[L].w++;}});
  const n=qs.length-tashrihi.length;
  let pct=n?Math.round(((c*3-w)*100/(n*3))*100)/100:0;
  /* آزمون کاملاً تشریحی: no تستی to apply the Konkur formula to — the grade is
     the mean of rubric scores (teacher can still override each one). */
  if(!n&&tashrihi.length)
    pct=Math.round(tashrihi.reduce((s,x)=>s+(x.grade.final!=null?x.grade.final:x.grade.score),0)/tashrihi.length*10)/10;
  return {c,w,b,pct,perL,tashrihi,n};
}
function lessonPct(x){return Math.round(((x.c*3-x.w)*100/(x.t*3))*10)/10;}
/* ---------- Mastery (prototype of blueprint §5.4) ---------- */
function masteryOf(lid,pid){
  const st=prof(pid||dispPid()).lessonStats[lid];if(!st||!st.tries.length)return null;
  const tr=st.tries;const last=tr[tr.length-1].p;
  const avg=tr.reduce((s,x)=>s+x.p,0)/tr.length;
  let m=Math.round(0.55*last+0.45*avg);m=Math.max(0,Math.min(100,m));
  const age=Math.floor((Date.now()-tr[tr.length-1].t)/864e5);
  return {m,n:tr.length,age};
}
/* ---------- Spider (radar) chart — pure SVG, no library, RTL-safe ---------- */
/* vals: 0..100 or null (null = not yet assessed, drawn as a hollow dot at the centre).
   labels: one per axis. Returns an <svg> string; call it for ONE subject at a time
   (axes = that subject's lessons) so 134 lessons stay readable. */
function spiderSVG(vals,labels,o={}){
  const n=vals.length;
  if(n<3)return '<div class="muted">نمودار عنکبوری حداقل ۳ محور می‌خواهد.</div>';
  const S=o.size||440,C=S/2,R=o.r||Math.round(C-64);
  const rings=o.rings||[25,50,75,100];
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[C+r*Math.cos(a),C+r*Math.sin(a)];};
  const rd=x=>Math.round(x*10)/10;
  const grid=rings.map(rv=>`<polygon points="${vals.map((_,i)=>pt(i,R*rv/100).map(rd).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const axes=labels.map((lb,i)=>{
    const[x1,y1]=pt(i,0),[x2,y2]=pt(i,R);
    const[lx,ly]=pt(i,R+16);
    const dy=ly<C-R*0.55?-3:(ly>C+R*0.55?10:4);
    const t=String(lb||'').slice(0,o.maxc||14)+(String(lb||'').length>(o.maxc||14)?'…':'');
    return `<line x1="${rd(x1)}" y1="${rd(y1)}" x2="${rd(x2)}" y2="${rd(y2)}" stroke="var(--line)" stroke-width="1"/><text x="${rd(lx)}" y="${rd(ly+dy)}" font-size="${o.fs||11}" text-anchor="middle" fill="#556">${t}</text>`;
  }).join('');
  const dp=vals.map((v,i)=>pt(i,R*Math.max(0,Math.min(100,v==null?0:v))/100));
  const data=`<polygon points="${dp.map(p=>p.map(rd).join(',')).join(' ')}" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="2.5"/>`;
  const dots=dp.map((p,i)=>{
    const un=vals[i]==null;
    return `<circle cx="${rd(p[0])}" cy="${rd(p[1])}" r="3.5" ${un?'fill="none" stroke="var(--acc)" stroke-width="2"':'fill="var(--acc)"'}><title>${String(labels[i])}: ${un?'هنوز ارزیابی نشده':fa(vals[i])+'٪'}</title></circle>`;
  }).join('');
  const rl=rings.map(rv=>`<text x="${C+5}" y="${rd(C-R*rv/100+9)}" font-size="9" fill="#9aa">${fa(rv)}</text>`).join('');
  return `<svg class="chart spider" viewBox="0 0 ${S} ${S}" style="width:100%;max-width:${o.maxw||S}px;direction:ltr">${grid}${axes}${data}${dots}${rl}</svg>`;
}
/* Per-subject spider data for one student: only subjects with at least one
   assessed lesson; each subject's axes = ALL its lessons (null when untested). */
function studentSpiders(pid){

    const tested=lessons.filter(l=>l.ms);

/* ---------- Study planner (weakness × ضریب × forgetting) ---------- */
function buildPlan(){
  const rows=allLessons().map(lid=>{
    const subj=LSUB[lid];const coef=SCOEF[subj];const ms=masteryOf(lid);
    const m=ms?ms.m:30;const age=ms?ms.age:21;
    const forget=1+0.5*Math.min(age,21)/21;
    const pr=(100-m)*coef*forget;
    return {lid,subj,coef,m,tested:!!ms,pr};
  }).sort((a,b)=>b.pr-a.pr);
  /* skill-first ordering: weak TESTED topics lead the week; untested lessons get
     at most two 🧭 assessment tasks (never swarm the plan) — full-3-year taxonomy */
  const tested=rows.filter(r=>r.tested).sort((a,b)=>b.pr-a.pr);
  const untested=rows.filter(r=>!r.tested).sort((a,b)=>b.coef-a.coef);
  const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  const plan=DAYS.map(d=>({day:d,tasks:[]}));
  const types=['مرور عمیق + ۱۵ تست','تست تمرینی زمان‌دار','مرور فواصل‌دار'];
  let di=0;
  if(tested.length){
    tested.slice(0,9).forEach((r,i)=>{
      plan[di%6].tasks.push({txt:`${LNAME[r.lid]} — ${types[i%3]}`,
        meta:`${fa(35+(i%3)*10)} دقیقه · ضریب ${fa(r.coef)} · تسلط فعلی ${fa(r.m)}٪`,
        star:r.pr>140?'★★★':r.pr>80?'★★':'★'});di++;});
    untested.slice(0,2).forEach((r,i)=>{
      plan[i%2].tasks.push({txt:`${LNAME[r.lid]} — 🧭 آزمون ارزیابی ۱۰ تستی (کشف سطح)`,
        meta:`ضریب ${fa(r.coef)} · هنوز ارزیابی نشده`,star:'★★'});});
  }else{
    untested.slice(0,9).forEach(r=>{
      plan[di%6].tasks.push({txt:`${LNAME[r.lid]} — 🧭 آزمون ارزیابی ۱۰ تستی (کشف سطح)`,
        meta:`ضریب ${fa(r.coef)} · هنوز ارزیابی نشده`,star:'★★'});di++;});
  }
  const weak3=tested.filter(r=>r.m<50).slice(0,3).map(r=>LNAME[r.lid]);
  plan[5].tasks.push({txt:'آزمون کوتاه ۱۵ سؤالی از مباحث ضعیف',meta:weak3.length?weak3.join('، '):'از مباحث اخیر',star:'★★★'});
  plan[6].tasks.push({txt:'استراحت + مرور آزاد اشتباهات هفته',meta:'اختیاری',star:'★'});
  const notes=[
    'اولویت = ضعف × ضریب درس × اثر فراموشی — هرچه ستاره بیشتر، فوریت بیشتر.',
    'مباحث ارزیابی‌نشده فقط با ۱-۲ آزمون 🧭 کشف سطح وارد برنامه می‌شوند تا برنامهٔ شما غرق تخمین نشود.',
    'پنجشنبه آزمون کوتاه → نتایج به‌صورت خودکار برنامهٔ هفتهٔ بعد را به‌روز می‌کند.',
  ];
  if(!prof(dispPid()).history.length)notes.unshift('هنوز آزمونی ثبت نشده؛ این برنامه بر مبنای ضرایب و تخمین اولیه است. با یک آزمون، شخصی‌سازی واقعی شروع می‌شود.');
  return {days:plan,notes,rows};
}

/* ---------- Class simulation + psychometrics (Phase-2 teacher analytics) ---------- */
function mulberry32(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296;};}
const NAMES=['علی','سارا','محمد','نگار','پارسا','یاسمین','آرش','مریم','دانیال','ترانه','کیان','روژینا','فرهاد','سوگند','امیرحسین','رها','آرمان','سارینا'];
/* دورهٔ اول متوسطه (هفتم تا نهم) + دورهٔ دوم (grade × major) — each class a
   separate group of 2 demo students. ⚠️ order matters: classFor maps index→class. */
const CLASS_LIST=['هفتم','هشتم','نهم','دهم تجربی','یازدهم تجربی','دوازدهم تجربی','دهم ریاضی','یازدهم ریاضی','دوازدهم ریاضی'];
const CLS0=CLASS_LIST[0];
function classFor(i){return CLASS_LIST[Math.floor(i/2)%CLASS_LIST.length];}
NAMES.forEach((n,i)=>{const a=i%2?'👩‍🎓':'👨‍🎓';ACCOUNTS['stu'+i]={id:'stu'+i,role:'student',name:n,avatar:a,pass:'1234',cls:classFor(i)};});
/* ---------- Yearly roster management (مدیریت دانش‌آموزان توسط مدیر) ----------
   Every school year: graduates are REMOVED, newcomers are ADDED. Changes are
   stored in state (stuExtra / stuRemoved) so the roster survives refresh.
   Every student-list view must read the LIVE roster via studentIds() — never NAMES. */
function applyRoster(){
  /* authoritative rebuild: demo base − graduates (stuRemoved) + newcomers (stuExtra).
     Rebuilding (not patching) keeps ACCOUNTS==roster even after backup restores. */
  Object.keys(ACCOUNTS).forEach(k=>{if(ACCOUNTS[k].role==='student')delete ACCOUNTS[k];});
  NAMES.forEach((n,i)=>{const pid='stu'+i;if(!(state.stuRemoved||[]).includes(pid))ACCOUNTS[pid]={id:pid,role:'student',name:n,avatar:i%2?'👩‍🎓':'👨‍🎓',pass:'1234',cls:classFor(i)};});
  (state.stuExtra||[]).forEach(e=>{ACCOUNTS[e.id]={id:e.id,role:'student',name:e.name,avatar:e.avatar||'👨‍🎓',pass:e.pass||'1234',cls:CLASS_LIST.includes(e.cls)?e.cls:CLS0};});
}
function studentIds(){   // live roster: all CURRENT student accounts, stable numeric order
  return Object.keys(ACCOUNTS).filter(k=>ACCOUNTS[k].role==='student')
    .sort((a,b)=>{const na=+((/^stu(\d+)$/.exec(a)||[0,9999])[1]),nb=+((/^stu(\d+)$/.exec(b)||[0,9999])[1]);return na-nb||a.localeCompare(b);});
}
function addStudent(o){
  o=o||{};const name=(o.name||'').trim();
  if(!name)return {err:'نام دانش‌آموز را بنویسید'};
  const cls=CLASS_LIST.includes(o.cls)?o.cls:CLS0;
  const pass=(o.pass||'').trim()||'1234';
  const avatar=o.avatar==='👩‍🎓'?'👩‍🎓':'👨‍🎓';
  if(!state.stuExtra)state.stuExtra=[];if(!state.stuRemoved)state.stuRemoved=[];
  let n=+state.stuSeq||0;   // monotone id counter — a removed graduate's id is NEVER reused
  if(n<=0){let mx=-1;studentIds().concat(state.stuRemoved).forEach(k=>{const m=/^stu(\d+)$/.exec(k);if(m)mx=Math.max(mx,+m[1]);});n=mx+1;}
  state.stuSeq=n+1;
  const id='stu'+n;
  ACCOUNTS[id]={id,role:'student',name,avatar,pass,cls};
  state.stuExtra.push({id,name,avatar,pass,cls});
  prof(id);                // fresh EMPTY profile — new student has no history yet
  save();return {ok:1,id};
}
function delStudent(pid){
  const a=ACCOUNTS[pid];
  if(!a)return {err:'حساب پیدا نشد'};
  if(a.role!=='student')return {err:'فقط حساب دانش‌آموز قابل حذف است'};
  delete ACCOUNTS[pid];
  state.stuExtra=state.stuExtra||[];state.stuRemoved=state.stuRemoved||[];
  const xi=state.stuExtra.findIndex(e=>e.id===pid);
  if(xi>=0)state.stuExtra.splice(xi,1);else state.stuRemoved.push(pid);
  delete state.profiles[pid];                                   // history + mastery gone
  Object.keys(state.pubResults).forEach(e=>{if(state.pubResults[e])delete state.pubResults[e][pid];});  // results gone
  if(state.teacherView===pid)state.teacherView=null;
  save();return {ok:1};
}

/* ---------- Memory & backup (حافظه و پشتیبان‌گیری) ----------
   Layer 1: localStorage — every mutation calls save() instantly, so refresh
            keeps all data on the same device/browser.
   Layer 2: this backup file — survives device/browser change (boss downloads
            hooshyar-backup.json and can restore it anywhere).
   Layer 3 (production/server): the API's database is DECOUPLED from the app
            server (hooshyar_db.py): PostgreSQL via HOOSHYAR_DSN (separate db
            service/volume — survives crashes & full server swaps with zero
            data loss) or SQLite via HOOSHYAR_DB for dev. Portable snapshots:
            GET /admin/backup (JSON) ⇄ `python tools/db_tool.py restore`. The
            frontend↔backend sync point is ready (apiFetch). */
function exportState(){return JSON.stringify({app:'ta',v:1,at:new Date().toISOString(),state},null,1);}
function importState(txt){
  let o;try{o=JSON.parse(txt);}catch(e){return {err:'فایل معتبر نیست (JSON خراب است)'};}
  const s=o&&o.state?o.state:o;                 // accept both wrapped + raw state
  if(!s||typeof s!=='object'||!s.profiles||!Array.isArray(s.published))return {err:'ساختار فایل پشتیبان درست نیست'};
  state=Object.assign(JSON.parse(JSON.stringify(DEF)),s);

}
let classSim=null;
function sigmoid(x){return 1/(1+Math.exp(-x));}
function simClass(qs,opts){
  opts=opts||{};const rng=opts.rng||Math.random;const n=opts.n||12;
  const students=NAMES.slice(0,n).map(name=>{
    const overall=45+rng()*45;
    const careless=0.02+rng()*0.12;
    const ability={};
    allLessons().forEach(l=>ability[l]=Math.max(5,Math.min(98,overall+rng()*30-15)));
    const ans=qs.map((q,qi)=>{
      if(q.type==='tashrihi'){
        const abil=ability[q.l]/100;
        const got=q.kw.filter(()=>rng()<abil*0.92).map(k=>k[0]);
        return got.length?'در پاسخ: '+got.join('، '):'';
      }
      if(opts.plantIdx===qi){
        if(rng()<0.04)return q.a;
        if(rng()<0.06)return null;
        return (q.a+2)%4;              // almost everyone falls into the trap option
      }
      const p=0.06+0.88*sigmoid((ability[q.l]-15-q.d*14)/10);
      if(rng()<p){
        if(rng()<careless)return [0,1,2,3].filter(o=>o!==q.a)[Math.floor(rng()*3)];
        return q.a;
      }
      if(rng()<0.06)return null;
      const w=[0,1,2,3].filter(o=>o!==q.a);
      return w[Math.floor(rng()*w.length)];
    });
    const res=gradeExam(qs,ans);
    const perLesson=Object.fromEntries(Object.entries(res.perL).map(([lid,x])=>[lid,lessonPct(x)]));
    return {name,ability,ans,res,perLesson};
  });
  return {qs,students,itemStats:itemAnalysis(qs,students)};
}
function itemAnalysis(qs,students){
  return qs.map((q,qi)=>{
    if(q.type==='tashrihi'){
      const sc=students.map(s=>{const t=s.res.tashrihi.find(t=>t.i===qi);return t?t.grade.score:0;});
      return {qi,q,type:'tashrihi',avg:Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)};
    }
    const corr=students.map(s=>s.ans[qi]===q.a?1:0);
    const total=students.map(s=>s.res.pct);
    const order=[...students.keys()].sort((a,b)=>total[b]-total[a]);
    const g=Math.max(1,Math.round(students.length*0.27));
    const pc=id=>id.reduce((s,i)=>s+corr[i],0)/id.length;
    const p=+pc([...students.keys()]).toFixed(2);
    const disc=+(pc(order.slice(0,g))-pc(order.slice(-g))).toFixed(2);
    const dist=[0,1,2,3].map(o=>({o,share:+((students.filter(s=>s.ans[qi]===o).length/students.length).toFixed(2))}));
    const flags=[];
    if(p<0.25)flags.push('خیلی سخت');
    if(p>0.9)flags.push('خیلی آسان');
    if(disc<0)flags.push('تمایز منفی — بررسی فوری');
    else if(disc<0.15)flags.push('تمایز ضعیف');
    dist.filter(d=>d.o!==q.a&&d.share>0.55).forEach(d=>flags.push('فریب قوی گزینهٔ '+'الف ب ج د'.split(' ')[d.o]));
    return {qi,q,type:'t',p,disc,dist,flags};
  });
}

const TABS=[['builder','📝 آزمون‌های من'],['school','🏢 داشبورد مدرسه'],['class','🏫 داشبورد کلاس'],['analytics','📊 تحلیل عملکرد'],['plan','🗓 برنامهٔ هفته'],['about','❓ راهنما']];
/* ---------- Tashrihi (descriptive) grading — simulated LLM rubric ----------
   PRODUCTION SWAP (blueprint §5.2/Gate C): send {question, model answer, rubric
   kw-weights, student text} to self-hosted LLM; keep the teacher adjustment UI
   exactly as-is. Here: normalized keyword matching simulates the model. */
function normFa(s){return String(s||'')
  .replace(/[يإأةؤئك]/g,ch=>({'ي':'ی','إ':'ا','أ':'ا','ة':'ه','ؤ':'و','ئ':'ی','ك':'ک'}[ch]))
  .replace(/\s+/g,' ').trim();}
function gradeTashrihi(q,text){
  const t=normFa(text);const hits=[];let score=0;
  for(const[kw,w]of q.kw){
    const ok=t.includes(normFa(kw));
    hits.push({kw,w,ok});if(ok)score+=w;}
  const words=t.trim().split(' ').filter(Boolean).length;
  let why;
  if(!t.trim())why='پاسخی نوشته نشده است.';
  else if(words<4)why='پاسخ بسیار کوتاه است؛ نکتهٔ کلیدی کامل بیان نشده.';
  else{
    const got=hits.filter(h=>h.ok).map(h=>h.kw);
    const miss=hits.filter(h=>!h.ok).map(h=>h.kw);
    why=(got.length?'نکته‌های دیده‌شده: '+got.join('، '):'نکتهٔ کلیدی‌ای یافت نشد')
      +(miss.length?' — جاافتاده: '+miss.join('، '):'');
  }
  return {score:Math.min(100,score),hits,why,words,final:null};
}

/* ---------- Print student report card (🖨 کارنامهٔ چاپی) ----------

   table with ranks, per-lesson mastery, latest تراز تخمینی (labelled demo),
   signatures. Data comes from the SAME local state the panels show. */
function buildReportPrintHtml(pid){
  const A=ACCOUNTS[pid]||{};
  const P=prof(pid);
  let dstr='';try{dstr=new Date().toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'});}catch(e){dstr='';}
  /* published exams this student took (online or کاغذی) */
  const hist=(state.published||[]).filter(p=>(state.pubResults[p.id]||{})[pid]).map(p=>{
    const all=state.pubResults[p.id];
    const pcts=Object.entries(all).map(([x,r])=>({pid:x,pct:r.pct})).sort((a,b)=>b.pct-a.pct);
    return {title:p.title,kind:p.kind,pct:all[pid].pct,manual:!!all[pid].manual,
      rank:pcts.findIndex(x=>x.pid===pid)+1,n:pcts.length,
      avg:Math.round(pcts.reduce((s,x)=>s+x.pct,0)/pcts.length*10)/10,
      traz:all[pid].traz||null,subs:all[pid].subs||null};
  }).reverse();
  const avgAll=hist.length?Math.round(hist.reduce((s,h)=>s+h.pct,0)/hist.length*10)/10:null;
  /* per-lesson mastery (only lessons that produce a mastery score) */

    .map(lid=>({lid,ms:masteryOf(lid,pid)})).filter(x=>x.ms)
    .sort((a,b)=>a.ms.m-b.ms.m);
  const weak=mrows.filter(x=>x.ms.m<50).slice(0,3);
  const histRows=hist.map(h=>`<tr><td>${h.title}${h.kind==='jame'?' 🎯':''}${h.manual?' 📝کاغذی':''}</td><td><b>${fa(h.pct)}٪</b></td><td>${fa(h.rank)} از ${fa(h.n)}</td><td>${fa(h.avg)}٪</td></tr>`
    +(h.subs?`<tr><td colspan="4" style="background:#f8f5ff;font-size:12px">🎯 کارنامهٔ جامع: ${Object.entries(h.subs).map(([s,b])=>`${SNAME[s]||s} ${fa(b.pct)}٪`).join(' · ')} — تراز تخمینی: <b>${fa(h.traz)}</b> (درون‌مدرسه‌ای)</td></tr>`:'')).join('');
  const mTable=mrows.length
    ?`<table class="tbl"><tr><th>مبحث</th><th>تسلط</th><th>تعداد تلاش</th><th>آخرین تمرین</th></tr>
      ${mrows.slice().reverse().map(x=>`<tr><td>${LNAME[x.lid]||x.lid}</td><td><b style="color:${x.ms.m<50?'#b91c1c':x.ms.m<75?'#b45309':'#15803d'}">${fa(x.ms.m)}٪</b></td><td>${fa(x.ms.n)}</td><td>${x.ms.age?fa(x.ms.age)+' روز پیش':'امروز'}</td></tr>`).join('')}</table>`
    :'<div class="pmeta">هنوز مبحثی ارزیابی نشده است.</div>';
  return `
  <div class="ph"><b>📋 کارنامهٔ تحلیلی دانش‌آموز</b><span>${A.name||'—'} · ${A.cls||''} · ${dstr}</span></div>
  <div class="pmeta">
    آزمون‌های برگزارشده: <b>${fa(hist.length)}</b> · میانگین درصد: <b>${avgAll==null?'—':fa(avgAll)+'٪'}</b>
    ${weak.length?` · 🔥 نیازمند تمرین فوری: <b>${weak.map(x=>LNAME[x.lid]).join('، ')}</b>`:' · وضعیت کلی خوب ✅'}
  </div>
  ${hist.length?`<div class="pdh">نتایج آزمون‌های معلم</div><table class="tbl"><tr><th>آزمون</th><th>درصد</th><th>رتبه در کلاس</th><th>میانگین کلاس</th></tr>${histRows}</table>`
    :'<div class="pmeta">هنوز در آزمون معلم شرکت نکرده است — این کارنامه بعد از اولین آزمون کامل می‌شود.</div>'}
  <div class="pdh" style="margin-top:10px">تسلط بر مباحث (مدل نمونهٔ فاز ۲ — تخمینی)</div>
  ${mTable}
  <div class="plegend">این کارنامه با دادهٔ همین مدرسه و توسط «دستیار هوشمند معلم» تولید شده است؛ تراز، تخمین درون‌مدرسه‌ای است نه سازمان سنجش. نمرهٔ منفی تست‌ها با فرمول رسمی کنکور محاسبه شده است.</div>
  <div class="psign"><span>امضای دانش‌آموز: ..............................</span><span>امضای والدین: ..............................</span><span>امضای مدیر مدرسه: ..............................</span></div>`;
}

function vMyResults(){
  const rows=[];

    const rank=pcts.findIndex(x=>x.pid===curPid())+1;

    rows.push(`<tr><td>${p.title}${p.kind==='jame'?' <span class="badge ai">🎯 جامع</span>':''}${mine.manual?' <span class="badge ai" title="امتحان کاغذی — نمرهٔ دستی معلم">📝 کاغذی</span>':''}</td><td><b style="color:${mcolor(mine.pct)}">${fa(mine.pct)}٪</b></td><td>🏅 ${fa(rank)} از ${fa(pcts.length)}</td><td>${fa(avg)}٪</td></tr>`

async function genSrv(lessonIds,count,level,kind){

    </div></div>
  <div class="card" style="display:flex;gap:8px;flex-wrap:wrap">

}
function vClass(){
  const S=classSim;   // was referenced undeclared -> strict-mode ReferenceError (blank dashboard)
  const head=`<div class="notice">داشبورد معلم (فاز ۲/۳ نقشهٔ راه): همین آزمونی که ساختید را <b>۱۲ دانش‌آموز شبیه‌سازی‌شده</b> با توانایی‌های واقع‌گرایانه پاسخ داده‌اند — نقشهٔ حرارتی مبحث×دانش‌آموز + تحلیل روان‌سنجی سؤال‌ها (p-value، تمایز، گزینه‌های فریبنده) به‌صورت خودکار ساخته می‌شود. ${S?'':'<b>اول از آزمون‌ساز یک آزمون بسازید و شروع کنید، بعد برگردید.</b>'}</div>`;
  const realOnly=cur().role==='teacher'?vClassSrv()+vTeacherWip():'';
  if(!S)return head+realOnly+`<div class="card"><h2>شبیه‌سازی پاسخ کلاس</h2><p class="muted">پس از ساخت و برگزاری یک آزمون از «آزمون‌ساز»، اینجا دکمهٔ «شبیه‌سازی پاسخ کلاس ۱۲نفره» فعال می‌شود (نقش کلاس واقعی در دمو).</p>
    <button class="btn ghost" data-act="tab" data-v="builder">← برو به آزمون‌ساز</button></div>`;
  const lids=[...new Set(S.qs.map(q=>q.l))];
  /* heatmap */
  const hRows=S.students.map(st=>{
    const cells=lids.map(lid=>{
      const v=st.perLesson[lid];
      if(v==null)return `<td class="hc" style="background:#f2f4f8;color:#9aa">–</td>`;
      return `<td class="hc" style="background:${mcolor(v)}1F;color:${mcolor(v)}" title="${st.name} — ${LNAME[lid]}: ${fa(v)}٪">${fa(v)}</td>`;}).join('');
    const avg=Math.round(lids.reduce((s,l)=>s+(st.perLesson[l]||0),0)/lids.length);
    return `<tr><td class="rn">${st.name}</td>${cells}<td class="hc" style="background:var(--chip)"><b>${fa(avg)}</b></td></tr>`;}).join('');
  const headRow=lids.map(l=>`<th title="${LNAME[l]}">${LNAME[l].split('(')[0].trim().slice(0,10)}</th>`).join('')+'<th>میانگین</th>';
  /* per-lesson class averages */
  const lbars=lids.map(l=>{
    const vals=S.students.map(s=>s.perLesson[l]).filter(v=>v!=null);
    const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    return `<div class="lrow"><span class="nm">${LNAME[l]}</span>
      <div class="bar-wrap"><div class="bar" style="width:${avg}%;background:${mcolor(avg)}"></div></div>
      <b style="width:64px;color:${mcolor(avg)}">${fa(avg)}٪</b></div>`;}).join('');
  /* flagged questions */
  const realWip=vTeacherWip();
  const flagged=S.itemStats.filter(x=>x.flags&&x.flags.length);
  const qrows=flagged.map(x=>{
    const L=['الف','ب','ج','د'];
    const dist=(x.dist||[]).map(d=>`<span style="font-size:11px;margin-left:6px">${L[d.o]}: ${fa(Math.round(d.share*100))}٪${d.o===x.q.a?' ✓':''}</span>`).join('');
    return `<tr><td>${fa(x.qi+1)}</td><td style="max-width:300px">${fa(x.q.q)}</td>
      <td>${x.p!=null?fa(Math.round(x.p*100))+'٪':'—'}</td><td style="color:${x.disc<0?'var(--bad)':x.disc<0.15?'var(--warn)':'inherit'}">${x.disc!=null?fa(x.disc):'—'}</td>
      <td>${dist}</td><td>${x.flags.map(f=>`<span class="kw ${f.includes('منفی')||f.includes('فوری')?'n':'y'}">${f}</span>`).join('')}</td></tr>`;}).join('');
  return head+`
  <div class="grid2">
    <div class="stat"><b>${fa(S.students.length)}</b>دانش‌آموز</div>
    <div class="stat"><b>${fa(Math.round(S.students.reduce((s,x)=>s+x.res.pct,0)/S.students.length*10)/10)}٪</b>میانگین درصد کلاس</div>
    <div class="stat"><b>${fa(flagged.length)}</b>سؤال نیازمند بازبینی</div>
    <div class="stat"><b>${fa(lids.length)}</b>مبحث پوشش داده شده</div>
  </div>
  <div class="card"><h2>🌡 نقشهٔ حرارتی کلاس (مبحث × دانش‌آموز)</h2>
    <div style="overflow-x:auto"><table class="ht"><tr><th style="text-align:right">دانش‌آموز</th>${headRow}</tr>${hRows}</table></div>
    <div class="muted">قرمز &lt;۴۰٪ · نارنجی ۴۰–۷۰٪ · سبز &gt;۷۰٪ — روی هر خانه نگه دارید تا نام مبحث را ببینید.</div></div>
  ${vClassSrv()}${realWip}
  <div class="card"><h2>میانگین کلاس به تفکیک مبحث</h2>${lbars}</div>
  ${qrows?`<div class="card"><h2>🚩 سؤال‌های نیازمند بازبینی (خروجی خودکار)</h2>
    <div class="muted" style="margin-bottom:6px">در نسخهٔ واقعی این جدول، فرمان «بازطراحی سؤال با 🤖» هم دارد.</div>
    <table class="tbl"><tr><th>#</th><th>سؤال</th><th>p-value</th><th>تمایز</th><th>توزیع گزینه‌ها</th><th>پرچم</th></tr>${qrows}</table></div>`:''}
  <div class="card"><button class="btn ghost" data-act="resim">🔁 شبیه‌سازی دوبارهٔ کلاس</button>
    <span class="muted"> هر بار توانایی‌ها و بی‌دقتی‌های متفاوت شبیه‌سازی می‌شوند.</span></div>`;
}
function viewPicker(ctx){
  if(cur().role==='student')return '';
  const chips=NAMES.map((n,i)=>{
    const pid='stu'+i;const P=state.profiles[pid];
    return `<span class="chip ${dispPid()===pid?'on':''}" data-act="views" data-id="${pid}">${i%2?'👩‍🎓':'👨‍🎓'} ${n}${P?` (${fa(P.history.length)} آزمون)`:''}</span>`;}).join('');
  return `<div class="card"><h2>👁 مشاهدهٔ داده‌های کدام دانش‌آموز؟ (${ctx})</h2>
    <span class="chip ${!state.teacherView?'on':''}" data-act="views" data-id="me">🧑‍🏫 خودم (معلم)</span>${chips}</div>`;
}
function vAnalytics(){
  const h=prof(dispPid()).history.slice().sort((a,b)=>a.t-b.t);
  const lids=allLessons();
  const rows=lids.map(lid=>{const ms=masteryOf(lid);return {lid,ms};});
  const tested=rows.filter(r=>r.ms);
  const avg=h.length?Math.round(h.reduce((s,x)=>s+x.pct,0)/h.length*10)/10:null;
  const weak=tested.filter(r=>r.ms.m<50).sort((a,b)=>a.ms.m-b.ms.m);
  let svg='';
  if(h.length>=2){
    const W=600,H=170,P=30,x0=P,x1=W-10,step=(x1-x0)/(h.length-1);
    const pts=h.map((e,i)=>[x0+i*step,H-P-(Math.max(0,Math.min(100,e.pct))/100)*(H-2*P)]);
    svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px">
      <line x1="${x0}" y1="${H-P}" x2="${x1}" y2="${H-P}" stroke="var(--line)"/>
      <line x1="${x0}" y1="${P}" x2="${x1}" y2="${P}" stroke="var(--line)"/>
      <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="3"/>
      ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--acc)"/>${(i===0||i===pts.length-1)?`<text x="${p[0]}" y="${p[1]-8}" font-size="12" text-anchor="middle">${fa(h[i].pct)}٪</text>`:''}`).join('')}
    </svg>`;
  }
  const testedRows=rows.filter(r=>r.ms),untestedRows=rows.filter(r=>!r.ms);
  const bars=testedRows.map(r=>{
    const nm=LNAME[r.lid];
    return `<div class="lrow"><span class="nm">${nm}</span>
      <div class="bar-wrap"><div class="bar" style="width:${r.ms.m}%;background:${mcolor(r.ms.m)}"></div></div>
      <b style="width:70px;color:${mcolor(r.ms.m)}">${fa(r.ms.m)}٪</b>
      <span class="muted" style="font-size:11px">${fa(r.ms.n)} آزمون${r.ms.age?` · ${fa(r.ms.age)} روز پیش`:''}</span></div>`;}).join('');
  /* 89 lessons now exist (3 years) — untested ones collapse to chips, not rows */
  const untestedHtml=untestedRows.length?`<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">${fa(untestedRows.length)} مبحث هنوز ارزیابی نشده — با آزمون معلم پوشش بدهید» (کلیک برای دیدن فهرست)</summary><div style="margin-top:6px">${untestedRows.map(r=>`<span class="chip" style="font-size:11px;cursor:default">${LNAME[r.lid]}</span>`).join('')}</div></details>`:'';
  const srvBars=(api.on&&api.role==='student'&&SRV.mastery&&Object.keys(SRV.mastery).length)?(()=>{
    const rows=Object.entries(SRV.mastery).map(([lid,v])=>`
      <div class="lrow"><span class="nm">${LNAME[lid]||lid}</span>
        <div class="bar-wrap"><div class="bar" style="width:${v.m}%;background:${mcolor(v.m)}"></div></div>
        <b style="width:70px;color:${mcolor(v.m)}">${fa(v.m)}٪</b>
        <span class="muted" style="font-size:11px">${fa(v.n)} تلاش · ${fa(v.age_days)} روز پیش</span></div>`).join('');
    return `<div class="card"><h2>🌐 تسلط شما — محاسبه‌شده روی سرور FastAPI</h2>${rows}</div>`;
  })():'';
  /* 🕸 Spider (radar) chart for student profiles — one big spider for the
     selected subject (axes = its lessons) + a mini spider per subject.
     Replaces the flat bar list, which is kept in a collapsed list view. */
  let spiderHtml='';
  const isStuView=prof(dispPid()).role==='student';
  if(isStuView&&testedRows.length){
    const subs=studentSpiders(dispPid());
    if(subs.length){
      if(!spiderSubj||!subs.some(s=>s.sid===spiderSubj))spiderSubj=subs[0].sid;
      const sel=subs.find(s=>s.sid===spiderSubj);
      const maxc=sel.lessons.length>16?7:sel.lessons.length>8?10:14;
      const chips=subs.map(s=>`<span class="chip ${s.sid===sel.sid?'on':''}" data-act="spider" data-spiderkind="chip" data-id="${s.sid}" style="cursor:pointer">${s.name}${s.avg!=null?` · ${fa(s.avg)}٪`:''}</span>`).join('');
      const mini=subs.map(s=>{
        const mc=s.lessons.length>16?6:s.lessons.length>8?8:10;
        const on=s.sid===sel.sid;
        return `<div class="spidermini ${on?'on':''}" data-act="spider" data-spiderkind="mini" data-id="${s.sid}" title="برای بزرگ‌نمایی این درس، روی رادار بزن" style="background:${on?'var(--soft)':'#fff'};border:1.5px solid ${on?'var(--acc)':'var(--line)'};border-radius:14px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background .15s">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px"><b>${s.name}</b><b style="color:${mcolor(s.avg)}">${fa(s.avg)}٪${on?' ✓':''}</b></div>
          ${spiderSVG(s.lessons.map(l=>l.ms?l.ms.m:null),s.lessons.map(l=>l.name),{size:200,maxw:200,maxc:mc,fs:9,rings:[50,100]})}
        </div>`;}).join('');
      spiderHtml=`<div class="card"><h2>🕸 تسلط من — نمودار عنکبوری: ${SNAME[sel.sid]}</h2>
        <div style="margin:2px 0 10px;display:flex;flex-wrap:wrap;gap:6px">${chips}</div>
        ${spiderSVG(sel.lessons.map(l=>l.ms?l.ms.m:null),sel.lessons.map(l=>l.name),{size:470,maxw:470,maxc})}
        <div class="muted" style="margin-top:4px">هر محور = یک مبحث «${SNAME[sel.sid]}»؛ مرکز = ۰٪ و لبهٔ بیرونی = ۱۰۰٪. دایره‌های توخالی = مبحثی که هنوز ارزیابی نشده. برای دیدن شکل تسلطت در درس دیگر، روی نام درس بالایی کلیک کن.</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px">${mini}</div>
        <div class="muted" style="margin-top:8px">👆 برای بزرگ‌نمایی یک درس، روی رادار کوچک همان درس بزن — جایگزین نمودار بزرگ بالا می‌شود.</div></div>`;
    }
  }
  return `
  ${srvBars}
  ${viewPicker('تحلیل عملکرد')}
  ${!h.length?`<div class="notice">${dispPid()===curPid()&&cur().role==='student'?'هنوز در هیچ آزمونی شرکت نکرده‌اید — از تب «آزمون‌های من» وارد آزمون معلم شوید.':'هنوز داده‌ای نیست.'} برای دیدن قدرت تحلیل: <button class="btn" data-act="demo">✨ بارگذاری دادهٔ نمایشی (ماه گذشته)</button></div>`:''}
  <div class="grid2">
    <div class="stat"><b>${fa(h.length)}</b>آزمون برگزارشده</div>
    <div class="stat"><b>${avg!=null?fa(avg)+'٪':'—'}</b>میانگین درصد</div>
    <div class="stat"><b>${weak.length?LNAME[weak[0].lid]:'—'}</b>بحرانی‌ترین مبحث</div>
  </div>

/* ---------- Actions ---------- */
function startTimer(){stopTimer();exam.timer=setInterval(tick,500);tick();}
function stopTimer(){if(exam&&exam.timer){clearInterval(exam.timer);exam.timer=null;}}
/* page-level countdown ticker for join windows (مهلت شرکت) — updates every
   [data-dl] chip; when a window expires mid-view, re-render locks the button */
let pubTicker=null;
function startPubTicker(){
  if(pubTicker||typeof document==='undefined')return;
  pubTicker=setInterval(()=>{
    let needRender=false;
    document.querySelectorAll('[data-dl]').forEach(elm=>{
      const ms=(+elm.dataset.dl)-Date.now();
      if(ms<=0){needRender=true;return;}
      const s=Math.ceil(ms/1000);
      elm.textContent=fa(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));
    });
    if(needRender)render();
  },1000);
}
function syncText(){
  const ta=el('tarea');
  if(ta&&exam&&exam.qs[idx]&&exam.qs[idx].type==='tashrihi')answers[idx]=ta.value;
}
function finishExam(force){
  syncText();
  const blanks=answers.filter((a,i)=>exam.qs[i].type!=='tashrihi'&&a==null).length;
  if(blanks>0&&!force){uiConfirm(`⚠️ ${fa(blanks)} سؤال تستی بی‌پاسخ مانده است.\nبا این حال تصحیح شود؟`,()=>finishExam(true));return;}
  stopTimer();
  lastResult={res:gradeExam(exam.qs,answers),qs:exam.qs,ans:answers.slice()};
  const entry={t:Date.now(),pct:lastResult.res.pct,n:exam.qs.length};
  const P=cur();
  P.history.push(entry);
  Object.entries(lastResult.res.perL).forEach(([lid,x])=>{
    if(!P.lessonStats[lid])P.lessonStats[lid]={tries:[]};
    P.lessonStats[lid].tries.push({t:Date.now(),p:lessonPct(x)});
  });
  if(lastResult.res.tashrihi.length)lastResult.res.tashrihi.forEach(x=>{
    const fin=x.grade.final!=null?x.grade.final:x.grade.score;
    if(!P.lessonStats[x.q.l])P.lessonStats[x.q.l]={tries:[]};
    P.lessonStats[x.q.l].tries.push({t:Date.now(),p:fin});
  });
  if(exam.pubId){
    /* آزمون جامع: alongside the overall percent, store per-subject breakdown
       (کارنامهٔ جامع) + estimated تراز so boss/student panels can show it. */
    const pub=state.published.find(p=>p.id===exam.pubId);
    const extra=(pub&&pub.kind==='jame')?{subs:jameBreakdown(exam.qs,answers),traz:estTraz(lastResult.res.pct)}:{};
    /* تشریحی: persist student text + keyword hits so the teacher can review
       what the AI found (and override the score) after the exam. */
    if(lastResult.res.tashrihi&&lastResult.res.tashrihi.length){
      extra.tash=lastResult.res.tashrihi.map(x=>({
        i:x.i,q:x.q.q,l:x.q.l,kw:x.q.kw,model:x.q.model,
        score:x.grade.score,final:x.grade.final,
        hits:x.grade.hits,words:x.grade.words,why:x.grade.why,
        text:String(answers[x.i]||'')
      }));
    }
    recordPubResult(exam.pubId,curPid(),lastResult.res.pct,Object.keys(extra).length?extra:null);
  }
  save();exam=null;answers=[];idx=0;reviewOpen=false;render();
}
/* per-login state hygiene: a teacher's lesson selection must auto-set to THEIR
   own subject — otherwise one teacher's saved selection poisons the next one's
   session (found by E2E: bio selection -> chem teacher had 0 topics). */
function onLogin(pid,A){
  state.profileId=pid;state.teacherView=null;
  if(A&&A.role==='teacher'){
    const okL=new Set(allLessons().filter(l=>(A.subjects||[]).includes(LSUB[l])));
    if(![...selSet()].some(l=>okL.has(l)))state.selLessons=[...okL];
  }
  save();
}
function onClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='tab'){view=b.dataset.v;
    const allowed=ROLE_TAB[cur().role]||ROLE_TAB.student;
    if(!allowed.includes(view))view=ROLE_HOME[cur().role]||'builder';
    lastResult=null;manualEid=null;essayEid=null;render();}
  else if(act==='les'){
    const sel=selSet();const id=b.dataset.id;
    sel.has(id)?sel.delete(id):sel.add(id);
    state.selLessons=[...sel];save();render();
  }
  else if(act==='all'){
    state.selLessons=teacherLessons();   // teacher: own subject only
    save();render();
  }
  else if(act==='gen'){
    cfg.count=+el('cCount').value;cfg.level=el('cLevel').value;
    cfg.kind=el('cKind')?el('cKind').value:'mix';
    if(!cfg.count||cfg.count<1)cfg.count=10;   // sanitise odd select states (never build a 0-question exam)
    /* subject scoping: teacher can only generate from their OWN lessons */
    const allowed=new Set(teacherLessons());
    const lids=[...selSet()].filter(l=>allowed.has(l));
    if(!lids.length){alert('برای درس شما مبحثی انتخاب نشده است.');return;}
    if(api.on&&api.role==='teacher'){genSrv(lids,cfg.count,cfg.level,cfg.kind);}
    else{
      const qs=mergeDrafts(assembleExam(lids,cfg.count,cfg.level,cfg.kind));
      el('app').innerHTML=vPreview(qs);window.__preview=qs;
    }
  }
  else if(act==='cqkwadd'){
    const inp=el('cqKwNew');const box=el('cqKwBox');const hid=el('cqK');
    if(!inp||!box||!hid)return;
    const word=(inp.value||'').trim();if(!word){alert('واژهٔ کلیدی را بنویسید');return;}
    const w=el('cqKwW')&&el('cqKwW').value!==''?+el('cqKwW').value:null;
    const piece=w>0?(word+':'+w):word;
    hid.value=hid.value.trim()?hid.value.replace(/\s*$/,'')+'، '+piece:piece;
    const hint=el('cqKwHint');if(hint)hint.remove();
    const chip=document.createElement('span');chip.className='kw y';
    chip.textContent='🔑 '+word+(w>0?' +'+w:'');
    box.appendChild(chip);
    inp.value='';if(el('cqKwW'))el('cqKwW').value='';
    inp.focus();
  }
  else if(act==='nahadd'){
    const src=BANK.find(q=>q.id===b.dataset.id&&q.type==='tashrihi');
    if(!src){alert('سؤال در بانک پیدا نشد');return;}
    if((state.draftQs||[]).some(q=>q.id===src.id)){alert('این سؤال قبلاً در سبد است');return;}
    state.draftQs.push({...src,src:'bank',approved:true});save();render();
  }
  else if(act==='fromtash'){
    try{
      const qs=examFromTeacherTashrihi();
      window.__preview=qs;window.__srvExam=null;
      el('app').innerHTML=vPreview(qs);
    }catch(err){alert('⚠️ '+err.message);}
  }

    const P=prof(pid);
    rec.tash.forEach(t=>{
      if(!t.l)return;
      if(!P.lessonStats[t.l])P.lessonStats[t.l]={tries:[]};
      const fin=t.final!=null?t.final:t.score;
      P.lessonStats[t.l].tries.push({t:Date.now(),p:fin});
    });
    if(P.history&&P.history.length){
      const last=P.history[P.history.length-1];

    render();

  else if(act==='printpub'){

    if(window.__srvExam){apiFetch('/exams/'+window.__srvExam.eid+'/approve','POST').catch(e=>alert(e.message));}
  }
  else if(act==='cancel'){render();}
  else if(act==='start'){
    exam={qs:window.__preview,t0:Date.now(),dur:window.__preview.length};
    answers=Array(exam.qs.length).fill(null);idx=0;render();startTimer();
  }
  else if(act==='paper'){
    exam={qs:window.__preview,paper:true};
    answers=Array(exam.qs.length).fill(null);idx=0;render();
  }
  else if(act==='go'){syncText();idx=+b.dataset.i;render();}
  else if(act==='next'){if(idx<exam.qs.length-1){syncText();idx++;render();}}
  else if(act==='prev'){if(idx>0){syncText();idx--;render();}}
  else if(act==='ans'){
    answers[idx]=answers[idx]===+b.dataset.i?null:+b.dataset.i;
    el('app').innerHTML=vRun();renderQ();
  }
  else if(act==='tadj'){
    const gi=+b.dataset.i;const inp=el('tadj-'+gi);
    if(inp&&lastResult&&lastResult.res.tashrihi[gi]){
      lastResult.res.tashrihi[gi].grade.final=Math.max(0,Math.min(100,+inp.value||0));
      /* pure تشریحی exam: the headline percent IS the rubric mean — keep it in
         sync when the teacher overrides a single question (trust rule). */
      const r=lastResult.res;
      if(!r.n&&r.tashrihi.length)
        r.pct=Math.round(r.tashrihi.reduce((s,x)=>s+(x.grade.final!=null?x.grade.final:x.grade.score),0)/r.tashrihi.length*10)/10;

  else if(act==='srvconn'){srvConnect();}

    const title=(((el('jmTitle')||{}).value)||'').trim()||'آزمون جامع کنکوری — پایان سال';

  else if(act==='dologin'){

    const p=(el('lp').value||'').trim();
    const acc=Object.values(ACCOUNTS).find(a=>a.id.toLowerCase()===u&&a.pass===p&&(loginRole?a.role===loginRole:true));
    if(!acc){loginErr='نام کاربری یا رمز اشتباه است (دمو: رمز ۱۲۳۴ — نام کاربری مثل admin یا teacher یا stu3)';render();return;}
    if(!state.profiles[acc.id]&&acc.role==='student')seedStudent(acc.id,+acc.id.replace('stu',''));
    else if(!state.profiles[acc.id])state.profiles[acc.id]={history:[],lessonStats:{},role:acc.role,name:acc.name,avatar:acc.avatar,cls:acc.cls};
    onLogin(acc.id,acc);
    view=ROLE_HOME[acc.role]||'builder';loginErr='';lastResult=null;render();
  }
  else if(act==='views'){
    state.teacherView=b.dataset.id==='me'?null:b.dataset.id;save();render();
  }
  else if(act==='spider'){
    spiderSubj=b.dataset.id;render();
  }
  else if(act==='pub'){

      const eid=window.__srvExam.eid;

        .then(()=>{alert(`آزمون روی سرور برای دانش‌آموزان منتشر شد ✅\nبا یک کاربر دانش‌آموز (s0 تا s4) وارد سرور شوید و در آن شرکت کنید.`);window.__srvExam=null;render();})

      return;

    const e=addPublished(qs.map(q=>({...q})),`${allTash?'آزمون تشریحی':'آزمون'} ${fa(qs.length)} سؤالی — ${subjNames}`,winMin,curPid(),targets.length?{targets}:null);
    state.draftQs=[];save();   // custom-question basket empties once the exam is deployed
    alert(`«${e.title}» برای ${fa(targets.length?targetCount(e):studentIds().length)} دانش‌آموز منتشر شد. ✅\n🎯 مخاطب: ${targets.length?targets.join('، '):'همهٔ کلاس‌ها'}\n⏳ مهلت شرکت: ${fa(winMin)} دقیقه — بعد از آن دکمه قفل می‌شود و هر دانش‌آموز فقط یک بار می‌تواند شرکت کند. نتیجهٔ هرکدام همین‌جا و در پنل خودشان ثبت می‌شود.`);

  else if(act==='weakexam'){

  }

function onKey(e){

  else if(e.key==='ArrowLeft'&&idx<exam.qs.length-1){idx++;render();}
  else if(e.key==='ArrowRight'&&idx>0){idx--;render();}
}

if(typeof module!=='undefined')module.exports=HOOSHYAR;

<!-- SCRIPT 3: V2 UI OVERLAY -->
<script>
/* ════════════════════════════════════════════════════════════════════════════════
 TA — redesigned frontend overlay (v2 UI)
 --------------------------------------------------------------------------------
 This block runs AFTER the engine and SHADOWS its view layer with a new UI/UX.
 The engine (data, exam logic, graders, planner, simClass, event dispatch via

/* ---------- Helpers for the new shell ---------- */

 ${actions?`<div class="page-actions">${actions}</div>`:''}
 </div><div class="stack">${body}</div>`;
}
function _metric(hue,label,value,sub){
 return `<div class="metric tone-${hue}">
 <div class="m-label">${label}</div>
 <div class="m-value">${value}</div>
 ${sub?`<div class="m-sub">${sub}</div>`:''}
 </div>`;
}
function _empty(title,sub){

}
